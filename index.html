<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Stats</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="panel" data-tauri-drag-region>
      <header class="head" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>Cursor</span>
        <span id="membership" class="muted" data-tauri-drag-region></span>
      </header>

      <div class="row">
        <span class="label">Plan usage</span>
        <span id="plan-used" class="value">—</span>
      </div>
      <div class="row">
        <span class="label">Last task cost</span>
        <span id="last-cost" class="value">—</span>
      </div>
      <div class="row">
        <span class="label">Period left</span>
        <span id="period-left" class="value">—</span>
      </div>
      <div class="row">
        <span class="label">Today's pace</span>
        <span id="pace" class="value">—</span>
      </div>

      <section id="chats-section" class="chats hidden">
        <div class="chats-label muted">Recent chats</div>
        <div id="chat-list"></div>
      </section>

      <footer class="foot">
        <span id="status" class="muted">Loading…</span>
        <div class="actions">
          <button type="button" id="chart-btn" title="Cost chart">▣</button>
          <button type="button" id="refresh-btn" title="Refresh">↻</button>
        </div>
      </footer>
    </main>
  </body>
</html>
